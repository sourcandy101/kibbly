; Camera test program for the ESP32-CAM (AI Thinker board).
; A test tool for the AI, not the feeder firmware: it joins WiFi and serves photos over HTTP.
; Flash it with circuit 6 (hardware/circuits_by_part/06_esp32_cam_flashing).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
